name: CI

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*/generate.py"
      - .github/workflows/ci.yaml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.find.outputs.folders }}
    steps:
      - uses: actions/checkout@v7

      - name: Find generation scripts
        id: find
        run: echo "folders=$(ls -d */generate.py | xargs -n1 dirname | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  generate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.discover.outputs.folders) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate ${{ matrix.folder }}
        run: python "$FOLDER/generate.py"
        env:
          FOLDER: ${{ matrix.folder }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the folder name inside the artifact, so that its layout doesn't depend on how many are downloaded.
      - name: Stage ${{ matrix.folder }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          cp -r "$FOLDER" "$RUNNER_TEMP/staging/"
        env:
          FOLDER: ${{ matrix.folder }}

      - uses: actions/upload-artifact@v7
        with:
          name: schemas-${{ matrix.folder }}
          path: ${{ runner.temp }}/staging

  commit:
    needs: generate
    # Commit the folders that were updated, even if others failed.
    if: ${{ !cancelled() && needs.generate.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: schemas-*
          path: ${{ runner.temp }}/schemas
          merge-multiple: true

      - name: Replace updated folders
        run: |
          shopt -s nullglob
          replaced=0
          for generated in "$RUNNER_TEMP"/schemas/*/; do
            folder=$(basename "$generated")
            # Only replace a top-level folder that has a generation script.
            [ -n "$folder" ] && [ -f "$folder/generate.py" ] || continue
            rm -rf -- "./$folder"
            cp -r "$generated" "./$folder"
            replaced=$((replaced + 1))
          done
          if [ "$replaced" -eq 0 ]; then
            echo "::error::No generated folder found in the artifacts"
            exit 1
          fi

      - name: Commit changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Schemas are up to date"
            exit 0
          fi
          folders=$(git diff --cached --name-only | cut -d/ -f1 | sort -u | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update schemas: $folders"
          git push
